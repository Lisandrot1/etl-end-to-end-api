version: "3.8"

services:
  minio:
    image: minio/minio
    container_name: minio 
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${access_key}
      MINIO_ROOT_PASSWORD: ${secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  etl:
    build:
      context: .
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      - minio

volumes:
  minio_data: