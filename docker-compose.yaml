# ============================================
# Docker Compose - Proyecto ETL con Github Actions
# ============================================
# Servicios:
#   - MinIO: Almacenamiento de datos
#   - ETL: Procesamiento de datos
# ============================================

services:

  # ============================================
  # MinIO - Almacenamiento S3
  # Consola: http://localhost:9001
  # API: http://minio:9000
  # ============================================
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${access_key}
      MINIO_ROOT_PASSWORD: ${secret_key}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
# ============================================
  # Pipeline ETL
  # ============================================
  etl:
    build:
      context: .
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      - minio
  # ============================================
  # Duckdb - Motor de Querys
  # ============================================
  analytics:
    build: ./analytics
    volumes:
      - ./analytics:/app
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - minio


volumes:
  minio_data:
  postgres_data:
